[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "zero-trust-llm-secops"
version = "0.3.0"
description = "LLM-assisted Zero Trust security event analysis and response simulation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "boto3>=1.40,<2.0",
  "fastapi>=0.115,<1.0",
  "mangum>=0.19,<1.0",
  "openai>=1.68,<3.0",
  "pydantic-settings>=2.7,<3.0",
  "uvicorn[standard]>=0.34,<1.0",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1.0",
  "pytest>=8.3,<9.0",
  "ruff>=0.11,<1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"
