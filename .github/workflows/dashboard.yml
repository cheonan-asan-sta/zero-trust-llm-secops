name: Dashboard

on:
  push:
    branches: [main, develop, aitest]
  pull_request:

permissions:
  contents: read

concurrency:
  group: dashboard-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  browser:
    name: dashboard-browser
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/python-locked
      - name: Install isolated browser test dependencies
        run: |
          python -m pip install --only-binary=:all: --require-hashes -r infra/runtime/requirements/browser.lock
          python -m playwright install --with-deps chromium
          python -m pip check
      - name: Verify dashboard with a synthetic local server
        run: python -m scripts.test_dashboard_browser --output-dir runtime/dashboard-browser
      - name: Save browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-browser-evidence
          path: |
            runtime/dashboard-browser/report.json
            runtime/dashboard-browser/*.png
            runtime/dashboard-browser/server.log
          retention-days: 7
