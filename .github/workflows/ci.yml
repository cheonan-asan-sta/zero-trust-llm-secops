name: CI

on:
  push:
    branches: [main, develop, aitest]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project
        run: python -m pip install -e ".[dev]"
      - name: Check code
        run: python -m ruff check .
      - name: Run tests
        run: python -m pytest -q
      - name: Build Lambda image
        run: docker build --file Dockerfile.lambda --tag zero-trust-llm-secops:ci .
