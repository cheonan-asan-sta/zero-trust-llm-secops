name: CI

on:
  push:
    branches: [main, develop, aitest]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: ./.github/actions/python-locked
      - name: Check code
        run: python -m ruff check .
      - name: Run tests
        run: python -m pytest -q

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Run tests in Docker
        run: |
          docker build --file Dockerfile.test --tag zero-trust-llm-secops:ci-tests .
          docker run --rm zero-trust-llm-secops:ci-tests

  runtime:
    name: runtime (${{ matrix.kind }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - kind: application
            directory: runtime/week3/app-recovery-ci
            verification: Verify application maintenance recovery
            report: Report application recovery verification
            command: python -m scripts.test_app_recovery_runtime --full-state --image zero-trust-llm-secops:ci --directory runtime/week3/app-recovery-ci
          - kind: application-mtls
            directory: runtime/c02/application-mtls-recovery-ci
            verification: Verify application recovery and token fencing over mTLS
            report: Report mTLS application recovery verification
            command: python -m scripts.test_recoverable_mtls_runtime --directory runtime/c02/application-mtls-recovery-ci
          - kind: response-mtls
            directory: runtime/c02/response-mtls-ci
            verification: Verify isolated response approvals and full mTLS restore
            report: Report response approval and restoration verification
            command: python -m scripts.test_response_mtls_runtime --directory runtime/c02/response-mtls-ci
          - kind: execution-mtls
            directory: runtime/c02/execution-mtls-ci
            verification: Verify continuous execution evidence and full mTLS restore
            report: Report execution evidence and restoration verification
            command: python -m scripts.test_execution_mtls_runtime --directory runtime/c02/execution-mtls-ci
          - kind: monitored
            directory: runtime/c02/collector-maintenance-ci
            verification: Verify collector maintenance over mTLS
            report: Report mTLS verification
            command: python -m scripts.test_continuous_mtls_runtime --monitoring --directory runtime/c02/collector-maintenance-ci
          - kind: authority
            directory: runtime/c02/authority-acceptance-ci
            verification: Verify CA integration acceptance
            report: Report CA integration verification
            command: python -m scripts.test_authority_mtls_runtime --directory runtime/c02/authority-acceptance-ci
          - kind: rekey
            directory: runtime/c02/rekey-acceptance-ci
            verification: Verify persistent private-key rotation
            report: Report private-key rotation verification
            command: python -m scripts.test_rekey_mtls_runtime --directory runtime/c02/rekey-acceptance-ci
          - kind: authority-ha
            directory: runtime/c02/persistent-authority-ci
            verification: Verify persistent authority rotation and CA failover
            report: Report persistent authority verification
            command: python -m scripts.test_persistent_authority_runtime --directory runtime/c02/persistent-authority-ci
          - kind: database-transport
            directory: runtime/c02/database-transport-ci
            verification: Verify database transport rotation and resume
            report: Report database transport verification
            command: python -m scripts.test_database_transport_runtime --directory runtime/c02/database-transport-ci
          - kind: database-backup
            directory: runtime/c02/database-backup-ci
            verification: Verify encrypted database backup and isolated restore
            report: Report database backup verification
            command: python -m scripts.test_database_backup_runtime --directory runtime/c02/database-backup-ci
          - kind: database-recovery
            directory: runtime/c02/database-recovery-ci
            verification: Verify database recovery checkpoint and rollback denial
            report: Report database recovery checkpoint verification
            command: python -m scripts.test_database_recovery_runtime --directory runtime/c02/database-recovery-ci
          - kind: selection
            directory: runtime/c02/selection-ci
            verification: Measure selected mTLS infrastructure load and recovery
            report: Report infrastructure selection verification
            command: python -m scripts.test_infra_selection_runtime --directory runtime/c02/selection-ci && python -m scripts.infra_selection --report runtime/c02/selection-ci/verification.json
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: ./.github/actions/python-locked
      - name: Build application image
        if: matrix.kind == 'application'
        run: docker build --platform linux/amd64 --provenance=false --file Dockerfile --tag zero-trust-llm-secops:ci .
      - name: ${{ matrix.verification }}
        run: ${{ matrix.command }}
      - name: ${{ matrix.report }}
        if: always()
        env:
          REPORT_DIRECTORY: ${{ matrix.directory }}
        run: |
          if [ -f "$REPORT_DIRECTORY/verification.json" ]; then
            cat "$REPORT_DIRECTORY/verification.json"
          fi

  lambda:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Build Lambda image
        run: docker build --platform linux/amd64 --provenance=false --file Dockerfile.lambda --tag zero-trust-llm-secops:lambda-ci .

  # Keep the existing required check name. Every dependency must succeed.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    if: always()
    needs: [unit, docker, runtime, lambda]
    steps:
      - name: Require every verification job
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python - <<'PY'
          import json, os
          results = json.loads(os.environ['RESULTS'])
          if set(results) != {'unit', 'docker', 'runtime', 'lambda'}:
              raise SystemExit('required_verification_missing')
          failed = [name for name, value in results.items() if value['result'] != 'success']
          print(json.dumps({name: value['result'] for name, value in results.items()}, sort_keys=True))
          if failed:
              raise SystemExit('required_verification_incomplete')
          PY
