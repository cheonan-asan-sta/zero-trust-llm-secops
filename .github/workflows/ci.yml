name: CI

on:
  push:
    branches: [main, develop, aitest]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project
        run: |
          python -m pip install --only-binary=:all: --require-hashes -r infra/runtime/requirements/build.lock
          python -m pip install --only-binary=:all: --require-hashes -r infra/runtime/requirements/test.lock
          python -m pip install --no-index --no-deps --no-build-isolation .
          python -m pip check
      - name: Check code
        run: python -m ruff check .
      - name: Run tests
        run: python -m pytest -q
      - name: Run tests in Docker
        run: |
          docker build --file Dockerfile.test --tag zero-trust-llm-secops:ci-tests .
          docker run --rm zero-trust-llm-secops:ci-tests
      - name: Build application image
        run: docker build --platform linux/amd64 --provenance=false --file Dockerfile --tag zero-trust-llm-secops:ci .
      - name: Verify application maintenance recovery
        run: python -m scripts.test_app_recovery_runtime --image zero-trust-llm-secops:ci --directory runtime/week3/app-recovery-ci
      - name: Report application recovery verification
        if: always()
        run: |
          if [ -f runtime/week3/app-recovery-ci/verification.json ]; then
            cat runtime/week3/app-recovery-ci/verification.json
          fi
      - name: Verify collector maintenance over mTLS
        run: python -m scripts.test_continuous_mtls_runtime --monitoring --directory runtime/c02/collector-maintenance-ci
      - name: Report mTLS verification
        if: always()
        run: |
          if [ -f runtime/c02/collector-maintenance-ci/verification.json ]; then
            cat runtime/c02/collector-maintenance-ci/verification.json
          fi
      - name: Verify CA integration acceptance
        run: python -m scripts.test_authority_mtls_runtime --directory runtime/c02/authority-acceptance-ci
      - name: Report CA integration verification
        if: always()
        run: |
          if [ -f runtime/c02/authority-acceptance-ci/verification.json ]; then
            cat runtime/c02/authority-acceptance-ci/verification.json
          fi
      - name: Build Lambda image
        run: docker build --platform linux/amd64 --provenance=false --file Dockerfile.lambda --tag zero-trust-llm-secops:lambda-ci .
