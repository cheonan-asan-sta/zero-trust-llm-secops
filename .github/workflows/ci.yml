name: CI

on:
  push:
    branches: [main, develop, aitest]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project
        run: python -m pip install -e ".[dev]"
      - name: Check code
        run: python -m ruff check .
      - name: Run tests
        run: python -m pytest -q
      - name: Run tests in Docker
        run: |
          docker build --file Dockerfile.test --tag zero-trust-llm-secops:ci-tests .
          docker run --rm zero-trust-llm-secops:ci-tests
      - name: Build application image
        run: docker build --platform linux/amd64 --provenance=false --file Dockerfile --tag zero-trust-llm-secops:ci .
      - name: Build Lambda image
        run: docker build --platform linux/amd64 --provenance=false --file Dockerfile.lambda --tag zero-trust-llm-secops:lambda-ci .
