worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 256; }
http {
    access_log off;
    client_body_temp_path /tmp/client;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    server {
        listen 8080 ssl;
        ssl_certificate /service-tls/proxy.pem;
        ssl_certificate_key /service-tls/proxy.key;
        ssl_client_certificate /service-tls/ca.pem;
        ssl_verify_client on;
        ssl_verify_depth 2;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_cache off;
        ssl_session_tickets off;
        keepalive_timeout 0;
        proxy_ssl_trusted_certificate /service-tls/ca.pem;
        proxy_ssl_verify on;
        proxy_ssl_verify_depth 2;
        proxy_ssl_server_name on;
        proxy_ssl_protocols TLSv1.2 TLSv1.3;
        proxy_ssl_session_reuse off;
        proxy_next_upstream off;
        proxy_connect_timeout 1s;
        proxy_read_timeout 2s;
        location = /documents {
            if ($request_method != GET) { return 405; }
            if ($request_uri != /documents) { return 403; }
            auth_request /_authorize;
            auth_request_set $handoff $upstream_http_x_pep_handoff;
            proxy_set_header X-PEP-Handoff $handoff;
            proxy_set_header X-API-Key "";
            proxy_set_header X-Session-ID "";
            proxy_set_header X-Grant-Token "";
            proxy_set_header Authorization "";
            proxy_set_header X-User "";
            proxy_set_header X-Tenant "";
            proxy_ssl_certificate /service-tls/proxy-resource.pem;
            proxy_ssl_certificate_key /service-tls/proxy-resource.key;
            proxy_ssl_name resource;
            proxy_pass https://resource:8083;
        }
        location = /_authorize {
            internal;
            proxy_method GET;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header X-C02-Target $request_uri;
            proxy_set_header X-PEP-Handoff "";
            proxy_set_header X-Verified-Client-Cert $ssl_client_escaped_cert;
            proxy_ssl_certificate /service-tls/proxy-auth.pem;
            proxy_ssl_certificate_key /service-tls/proxy-auth.key;
            proxy_ssl_name bridge-auth;
            proxy_pass https://bridge:8081;
        }
        location / { return 403; }
    }
}
