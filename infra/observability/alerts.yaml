groups:
  - name: c01-zero-trust-operations
    interval: 1s
    rules:
      - alert: C01SignalQueueBacklog
        expr: secops_signal_inbox_records{state="pending"} > 0 and on(job,instance) secops_signal_inbox_oldest_pending_age_seconds > 3
        for: 2s
        labels:
          severity: warning
      - alert: C01SignalCollectionUnavailable
        expr: secops_signal_collection_success == 0
        for: 2s
        labels:
          severity: critical
      - alert: C01ExporterDown
        expr: up{job="zt-signals"} == 0 or absent(up{job="zt-signals"})
        for: 2s
        labels:
          severity: critical
      - alert: C01SignalProcessingFailed
        expr: secops_signal_inbox_records{state="failed"} > 0
        for: 2s
        labels:
          severity: critical
      - alert: C01CollectorObservationNotFresh
        expr: secops_collector_bridge_enabled == 1 and on(job,instance) secops_collector_observation_fresh == 0
        for: 2s
        labels:
          severity: critical
      - alert: C01CollectorArchiveUnavailable
        expr: secops_collector_bridge_enabled == 1 and on(job,instance) secops_collector_status_success{worker="archive"} == 0
        for: 2s
        labels:
          severity: critical
      - alert: C01CollectorArchivePressure
        expr: secops_collector_bridge_enabled == 1 and on(job,instance) secops_collector_archive_storage_pressure == 1
        for: 2s
        labels:
          severity: warning
      - alert: C01CaptureBackupVerificationUnavailable
        expr: secops_capture_backup_bridge_enabled == 1 and on(job,instance) secops_capture_backup_status_success == 0
        for: 2s
        labels:
          severity: critical
      - alert: C01CaptureBackupRecoveryOverdue
        expr: secops_capture_backup_bridge_enabled == 1 and on(job,instance) secops_capture_backup_status_success == 1 and on(job,instance) secops_capture_backup_recovery_recent == 0
        for: 2s
        labels:
          severity: warning
      - alert: C01ExecOutboxUnavailable
        expr: secops_exec_outbox_bridge_enabled == 1 and on(job,instance) secops_exec_outbox_status_success == 0
        for: 2s
        labels:
          severity: critical
      - alert: C01ExecOutboxPendingOverdue
        expr: secops_exec_outbox_bridge_enabled == 1 and on(job,instance) secops_exec_outbox_status_success == 1 and on(job,instance) secops_exec_outbox_pending_overdue == 1
        for: 2s
        labels:
          severity: critical
      - alert: C01ExecOutboxCapacityPressure
        expr: secops_exec_outbox_bridge_enabled == 1 and on(job,instance) secops_exec_outbox_status_success == 1 and on(job,instance) secops_exec_outbox_capacity_pressure == 1
        for: 2s
        labels:
          severity: warning
      - alert: C01ExecRecoveryUnavailable
        expr: secops_exec_recovery_bridge_enabled == 1 and on(job,instance) secops_exec_recovery_status_success == 0
        for: 2s
        labels:
          severity: critical
      - alert: C01ExecRecoveryIndeterminateOverdue
        expr: secops_exec_recovery_bridge_enabled == 1 and on(job,instance) secops_exec_recovery_status_success == 1 and on(job,instance) secops_exec_recovery_indeterminate_overdue == 1
        for: 2s
        labels:
          severity: critical
      - alert: C01ExecRecoveryPublicationOverdue
        expr: secops_exec_recovery_bridge_enabled == 1 and on(job,instance) secops_exec_recovery_status_success == 1 and on(job,instance) secops_exec_recovery_unpublished_overdue == 1
        for: 2s
        labels:
          severity: critical
      - alert: C01ExecRecoveryCapacityPressure
        expr: secops_exec_recovery_bridge_enabled == 1 and on(job,instance) secops_exec_recovery_status_success == 1 and on(job,instance) secops_exec_recovery_capacity_pressure == 1
        for: 2s
        labels:
          severity: warning
      - alert: C01ExecBundleVerificationUnavailable
        expr: secops_exec_bundle_bridge_enabled == 1 and on(job,instance) secops_exec_bundle_status_success == 0
        for: 2s
        labels:
          severity: critical
      - alert: C01ExecBundleRecoveryOverdue
        expr: secops_exec_bundle_bridge_enabled == 1 and on(job,instance) secops_exec_bundle_status_success == 1 and on(job,instance) secops_exec_bundle_recovery_recent == 0
        for: 2s
        labels:
          severity: warning
      - alert: C01ExecBundleIndeterminateRetained
        expr: secops_exec_bundle_bridge_enabled == 1 and on(job,instance) secops_exec_bundle_status_success == 1 and on(job,instance) secops_exec_bundle_indeterminate_retained == 1
        for: 2s
        labels:
          severity: warning
      - alert: C01WitnessStatusUnavailable
        expr: secops_witness_bridge_enabled == 1 and on(job,instance) secops_witness_status_success == 0
        for: 2s
        labels:
          severity: critical
      - alert: C01WitnessObservationNotHealthy
        expr: secops_witness_bridge_enabled == 1 and on(job,instance) secops_witness_status_success == 1 and on(job,instance) (secops_witness_observation_action_required == 1 or (secops_witness_observation_healthy == 0 unless on(job,instance) secops_witness_observation_action_required))
        for: 2s
        labels:
          severity: critical
      - alert: C01WitnessCapacityPressure
        expr: secops_witness_state{state=~"capacity_pressure|capacity_exhausted"} == 1
        for: 2s
        labels:
          severity: warning
      - alert: C01WitnessCollectionFailed
        expr: secops_witness_bridge_enabled == 1 and on(job,instance) secops_witness_status_success == 1 and on(job,instance) secops_witness_last_cycle_success == 0
        for: 2s
        labels:
          severity: critical
      - alert: C01WitnessRestoreVerificationUnavailable
        expr: secops_witness_restore_bridge_enabled == 1 and on(job,instance) secops_witness_restore_status_success == 0
        for: 2s
        labels:
          severity: critical
      - alert: C01WitnessRestoreReviewOverdue
        expr: secops_witness_restore_bridge_enabled == 1 and on(job,instance) secops_witness_restore_status_success == 1 and on(job,instance) secops_witness_restore_recent == 0
        for: 2s
        labels:
          severity: warning
      - alert: C01LoginQueueStatusUnavailable
        expr: secops_login_queue_bridge_enabled == 1 and on(job,instance) secops_login_queue_status_success == 0
        for: 30s
        labels:
          severity: critical
      - alert: C01LoginQueueBacklog
        expr: secops_login_queue_bridge_enabled == 1 and on(job,instance) secops_login_queue_status_success == 1 and on(job,instance) secops_login_queue_pending_attention == 1
        for: 30s
        labels:
          severity: warning
      - alert: C01LoginQueueHeld
        expr: secops_login_queue_bridge_enabled == 1 and on(job,instance) secops_login_queue_status_success == 1 and on(job,instance) secops_login_queue_held > 0
        for: 30s
        labels:
          severity: warning
      - alert: C01LoginQueueCapacityPressure
        expr: secops_login_queue_bridge_enabled == 1 and on(job,instance) secops_login_queue_status_success == 1 and on(job,instance) secops_login_queue_capacity_pressure == 1
        for: 30s
        labels:
          severity: warning
