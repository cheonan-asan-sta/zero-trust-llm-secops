# Controlled aggregate rule contracts; not labeled threat evaluation.
rule_files:
- alerts.yaml
evaluation_interval: 1s
tests:
- name: opted_out
  interval: 1s
  input_series: []
  alert_rule_test:
  - eval_time: 3s
    alertname: C01WitnessStatusUnavailable
    exp_alerts: []
  - eval_time: 3s
    alertname: C01WitnessObservationNotHealthy
    exp_alerts: []
  - eval_time: 3s
    alertname: C01WitnessCapacityPressure
    exp_alerts: []
  - eval_time: 3s
    alertname: C01WitnessCollectionFailed
    exp_alerts: []
  - eval_time: 3s
    alertname: C01WitnessRestoreVerificationUnavailable
    exp_alerts: []
  - eval_time: 3s
    alertname: C01WitnessRestoreReviewOverdue
    exp_alerts: []
- name: healthy
  interval: 1s
  input_series:
  - series: secops_witness_bridge_enabled{job="zt-signals",instance="local"}
    values: 1+0x6
  - series: secops_witness_status_success{job="zt-signals",instance="local"}
    values: 1+0x6
  - series: secops_witness_observation_healthy{job="zt-signals",instance="local"}
    values: 1+0x6
  - series: secops_witness_last_cycle_success{job="zt-signals",instance="local"}
    values: 1+0x6
  alert_rule_test:
  - eval_time: 3s
    alertname: C01WitnessStatusUnavailable
    exp_alerts: []
  - eval_time: 3s
    alertname: C01WitnessObservationNotHealthy
    exp_alerts: []
  - eval_time: 3s
    alertname: C01WitnessCapacityPressure
    exp_alerts: []
  - eval_time: 3s
    alertname: C01WitnessCollectionFailed
    exp_alerts: []
  - eval_time: 3s
    alertname: C01WitnessRestoreVerificationUnavailable
    exp_alerts: []
  - eval_time: 3s
