# Opt in by installing this drop-in after reviewing the aggregate status directory.
# Only aggregate status is public; original captures and the ledger stay private.
[Service]
CacheDirectory=secops-capture-status
CacheDirectoryMode=0755
ExecStart=
ExecStart=/opt/secops/.venv/bin/python -m scripts.service_capture_status --observe-worker-security --tenant ${TENANT_ID} --server ${SERVER_ID} --unit %i.service --source ${RUNTIME_SOURCE_ID} --key-id ${RUNTIME_KEY_ID} --capture /var/lib/secops-evidence/%i/latest.json --registry /etc/secops/service-registry.json --registry-sha256 ${SERVICE_REGISTRY_SHA256} --ledger /var/lib/secops-capture-health/%i.sqlite3 --status-output /var/cache/secops-capture-status/%i-health.json
