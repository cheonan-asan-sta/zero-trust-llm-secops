static_resources:
  listeners:
  - name: pep
    address: {socket_address: {address: 0.0.0.0, port_value: 8080}}
    filter_chains:
    - filters:
      - name: envoy.filters.network.http_connection_manager
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
          stat_prefix: pep
          normalize_path: false
          merge_slashes: false
          path_with_escaped_slashes_action: REJECT_REQUEST
          route_config:
            name: documents_only
            virtual_hosts:
            - name: documents
              domains: ["*"]
              request_headers_to_remove: [x-api-key, x-session-id, x-grant-token, authorization, x-user, x-tenant]
              routes:
              - match: {path: /documents, headers: [{name: ":method", string_match: {exact: GET}}]}
                route: {cluster: resource, timeout: 3s}
              - match: {prefix: /}
                direct_response: {status: 403}
          http_filters:
          - name: envoy.filters.http.ext_authz
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.http.ext_authz.v3.ExtAuthz
              failure_mode_allow: false
              clear_route_cache: false
              status_on_error: {code: ServiceUnavailable}
              allowed_headers:
                patterns: [{exact: x-api-key}, {exact: x-session-id}, {exact: x-grant-token}]
              http_service:
                server_uri: {uri: http://bridge:8081, cluster: authorization, timeout: 2s}
                authorization_response:
                  allowed_upstream_headers: {patterns: [{exact: x-pep-handoff}]}
                  allowed_client_headers: {patterns: [{exact: cache-control}]}
          - name: envoy.filters.http.router
            typed_config: {"@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router}
  clusters:
  - name: authorization
    connect_timeout: 1s
    type: STRICT_DNS
    load_assignment:
      cluster_name: authorization
      endpoints:
      - lb_endpoints:
        - endpoint: {address: {socket_address: {address: bridge, port_value: 8081}}}
  - name: resource
    connect_timeout: 1s
    type: STRICT_DNS
    load_assignment:
      cluster_name: resource
      endpoints:
      - lb_endpoints:
        - endpoint: {address: {socket_address: {address: resource, port_value: 8083}}}
