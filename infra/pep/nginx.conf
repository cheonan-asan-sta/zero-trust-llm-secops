worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 256; }
http {
    access_log off;
    client_body_temp_path /tmp/client;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    server {
        listen 8080;
        location = /documents {
            if ($request_method != GET) { return 405; }
            if ($request_uri != /documents) { return 403; }
            auth_request /_authorize;
            auth_request_set $handoff $upstream_http_x_pep_handoff;
            proxy_set_header X-PEP-Handoff $handoff;
            proxy_set_header X-API-Key "";
            proxy_set_header X-Session-ID "";
            proxy_set_header X-Grant-Token "";
            proxy_set_header Authorization "";
            proxy_set_header X-User "";
            proxy_set_header X-Tenant "";
            proxy_next_upstream off;
            proxy_read_timeout 2s;
            proxy_pass http://resource:8083;
        }
        location = /_authorize {
            internal;
            proxy_method GET;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header X-C02-Target $request_uri;
            proxy_set_header X-PEP-Handoff "";
            proxy_next_upstream off;
            proxy_connect_timeout 1s;
            proxy_read_timeout 2s;
            proxy_pass http://bridge:8081;
        }
        location / { return 403; }
    }
}
