name: zero-trust-llm-secops

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: zero-trust-llm-secops:local
    environment:
      APP_ENVIRONMENT: local
      ANALYZER_MODE: rule
      AUTH_MODE: disabled
      AUDIT_BACKEND: jsonl
      AUDIT_LOG_PATH: /data/audit.jsonl
      CASE_LOG_PATH: /data/cases.jsonl
      OUTBOX_LOG_PATH: /data/integration-outbox.jsonl
    ports:
      - "127.0.0.1:${SECOPS_PORT:-8000}:8000"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    volumes:
      - secops-audit:/data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: "no"

volumes:
  secops-audit:
