title: Zero Trust Credential Anomaly
id: 8a1b2c3d-4e5f-4a6b-8c7d-8e9f0a1b2c3d
status: test
description: Detects repeated authentication failures from an anomalous location or burst source.
author: Cheonan-Asan Team
date: '2026-09-16'
modified: '2026-09-16'
taxonomy: ocsf
references:
    - https://attack.mitre.org/techniques/T1110/
    - https://github.com/splunk/attack_data/tree/master/datasets/attack_techniques/T1110.001/aws_login_failure
logsource:
    category: application
    product: zero_trust_secops
detection:
    selection_auth:
        status_id: 2
        unmapped.auth.failed_attempts|gte: 3
    selection_context:
        - unmapped.network.location_anomaly: true
        - unmapped.behavior.request_rate: high
    condition: all of selection_*
falsepositives:
    - Approved travel, VPN egress changes, or service-health retry bursts.
level: critical
tags:
    - attack.credential-access
    - attack.t1110
x_secops:
    lifecycle: approved
    version: 1.0.0
    approved_by: security-owner
    approved_on: '2026-09-16'
    test_case_ids:
        - ZT-S01
        - PUBLIC-SPLUNK-T1110.001
